<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Harnesses are drawn and kept in this browser, and sync with Loom's private data repo (GitHub) when
     signed in. Other network use: reading Signoff PL projects and a board's fab package from Signoff
     EE's private repos (GitHub, read only), with JSZip and SheetJS pinned like Fabcheck's, and the STEP
     reader (jsDelivr, in a worker) for connector faces from a 3D model. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.sheetjs.com https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://api.github.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Loom · Harness drawings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23004952'/%3E%3Cpath d='M7 11h6c4 0 4 10 8 10h4M7 21h6c4 0 4-10 8-10h4' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/suite.css?v=db79ef89cfa4">
<link rel="stylesheet" href="assets/styles.css?v=db79ef89cfa4">
</head>
<body>
<div id="demo-banner" class="demo-banner" hidden></div>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" data-act="home" style="cursor:pointer" title="Home">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 6.5h4.5c3 0 3 7 6 7h4.5M2.5 13.5h4.5c3 0 3-7 6-7h4.5"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Loom</div>
        <div class="brand-sub">Dovetail harness drawings</div>
      </div>
      <button class="icon-btn side-collapse" data-act="nav" title="Hide the menu ( [ )" aria-label="Hide the menu">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M7.5 3.5v13"/><path d="M13.5 8l-2 2 2 2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="side-head">
      <span class="side-label">Harnesses</span>
      <button class="icon-btn" data-act="new" title="New harness (N)" aria-label="New harness">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>
    <nav class="side-list" id="harness-list"></nav>
    <button class="side-link" data-act="open" title="Open a .loom.json file">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2V14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Open a file
    </button>
    <!-- The guide (assets/guide.js): a walk through every feature, on the demo harness. -->
    <button class="side-link" data-act="guide" title="A walk through everything Loom does, on the demo harness">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M12.8 7.2 11 11l-3.8 1.8L9 9z"/></svg>
      Guide
    </button>
    <div class="side-tools">
      <div class="side-head"><span class="side-label">Dovetail Signoff</span></div>
      <a class="side-link" href="../pcb_dfm/index.html" data-demo-href title="Open Fabcheck, the PCB fab package check">
        <span class="tool-mark"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6"><rect x="1.5" y="1.5" width="15" height="15" rx="2.5"/><circle cx="6" cy="6" r="1.4" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="#fff" stroke="none"/></svg></span>
        <span>Fabcheck<small>PCB fab package check</small></span>
      </a>
      <a class="side-link" href="../signoff/index.html" data-demo-href title="Back to Dovetail Signoff, all tools">
        <span class="tool-mark"><svg viewBox="0 0 18 18" fill="#fff"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg></span>
        <span>All tools<small>Dovetail Signoff home</small></span>
      </a>
    </div>
    <div class="side-foot">
      <button class="sync-pill" data-act="sync" id="sync-pill" title="Sync with GitHub (Ctrl+S)">
        <span class="sync-dot" id="sync-dot"></span>
        <span class="sync-text"><span class="sync-title" id="sync-title">Local only</span><span class="sync-sub" id="sync-sub">Sign in to Signoff EE to sync</span></span>
      </button>
      <button class="icon-btn" data-act="theme" id="theme-btn" title="Dark mode" aria-label="Toggle dark mode"></button>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="toolbar" id="toolbar">
      <button class="icon-btn menu-toggle" data-act="nav" title="Show the menu ( [ )" aria-label="Show the menu">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <div class="toolbar-center"><div class="seg" id="view-seg" role="tablist"></div></div>
      <div class="toolbar-actions" id="toolbar-actions"></div>
    </header>
    <div id="page"></div>
    <section class="build-view" id="build-view" hidden>
      <div class="parts-pane" id="parts-pane"></div>
      <div class="canvas-wrap cv-paper" id="canvas-wrap">
        <svg class="lm-canvas" id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="board-hud" id="hud"></div>
        <div class="board-hud right" id="hud-right"></div>
        <div class="tip" id="tip"></div>
        <div class="hud-br"><label class="seg glass hud-check" title="Lay the harness out to scale from its lengths. Untick for the arranged view."><input type="checkbox" data-hud="prop" id="propview"><span>Real proportions</span></label><label class="seg glass hud-check" title="Show the text on each wire: its ends, color, and twist"><input type="checkbox" data-hud="wtext" id="wtext" checked><span>Wire labels</span></label><div class="seg glass zoom-pill" id="coords"><button data-act="zoom-out" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button><button class="zoom-val" id="zoom-val" data-act="zoom-reset" title="Actual size (0)">100%</button><button data-act="zoom-in" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg></button></div></div>
      </div>
      <aside class="rail" id="rail"></aside>
    </section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div class="lm-modal-back" id="cfg-modal" hidden><div class="lm-modal cfg" role="dialog" aria-modal="true" aria-label="Configure connector" id="cfg-body"></div></div>
<div class="lm-modal-back" id="board-modal" hidden><div class="lm-modal" role="dialog" aria-modal="true" aria-label="Add a board connector" id="board-modal-body"></div></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
<script src="assets/vendor/ipc356.js?v=db79ef89cfa4"></script>
<script src="assets/vendor/assembly.js?v=db79ef89cfa4"></script>
<script src="assets/version.js?v=db79ef89cfa4"></script>
<script src="assets/util.js?v=db79ef89cfa4"></script>
<script src="assets/library.js?v=db79ef89cfa4"></script>
<script src="assets/model.js?v=db79ef89cfa4"></script>
<!-- The Signoff engine's GitHub storage (vendored from Signoff EE), then Loom's sync on top of it. -->
<script src="assets/vendor/model.js?v=db79ef89cfa4"></script>
<script src="assets/vendor/github.js?v=db79ef89cfa4"></script>
<script src="assets/store.js?v=db79ef89cfa4"></script>
<script src="assets/conn.js?v=db79ef89cfa4"></script>
<script src="assets/boards.js?v=db79ef89cfa4"></script>
<script src="assets/shapes.js?v=db79ef89cfa4"></script>
<script src="assets/sheet.js?v=db79ef89cfa4"></script>
<script src="assets/step.js?v=db79ef89cfa4"></script>
<script src="assets/configure.js?v=db79ef89cfa4"></script>
<script src="assets/demo.js?v=db79ef89cfa4"></script>
<script src="assets/app.js?v=db79ef89cfa4"></script>
<!-- Animated logo: assets/mark.js swaps the sidebar's static mark for the spinning one. -->
<script src="assets/mark.js?v=db79ef89cfa4"></script>
<!-- The guide, before the suite's demo tour, whose Loom step offers it. -->
<script src="assets/guide.js?v=db79ef89cfa4"></script>
<!-- Demo tour: signoff/assets/tour.js does nothing outside ?demo, or before the hub starts the tour. -->
<script src="../signoff/assets/tour.js"></script>
</body>
</html>
